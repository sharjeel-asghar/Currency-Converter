<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Exchange</title>
  <link rel="stylesheet" href="style.css">
  <script src="./script.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <div class="container">
    <div class="converter">
      <h3>Currency Converter</h3>
      <div class="currency-input">
        <label for="amount-field">Enter Amount</label>
      <input type="number" id="amount-field" value="1">
      </div>
      <div class="dropdown">
        <div class="from">
          <p>From</p>
          <div class="select-container">
           <img src="https://flagsapi.com/US/flat/64.png" alt="">
           <select name="from">
            <option value="USD">USD</option>
            <option value="INR">INR</option>
            <option value="EUR">EUR</option>
            <option value="AUD">AUD</option>
           </select>
          </div>
        </div>
        <p class="exchange-icon">
          <i class="fa-solid fa-arrow-right-arrow-left"></i>
        </p>
        <div class="to">
            <p>To</p>
          <div  class="select-container">
           <img src="https://flagsapi.com/PK/flat/64.png" alt="">
           <select name="from" id="from"> 
            <option value="USD">USD</option>
            <option value="PKR" selected>PKR</option>
            <option value="EUR">EUR</option>
            <option value="AUD">AUD</option>
           </select>
          </div>
        </div>
      </div>
      <div class="msg">1USD = 70INR</div>
      <button class="exchange-btn">Get Exchange Rate</button>
    </div>
  </div>
</body>

</html>
